        let currentSection = 'grammar';
        let currentIndex = 0;
        let answered = false;

        function getActiveList() {
            return currentSection === 'grammar' ? grammarQuestions : readingQuestions;
        }

        function changeSection(section) {
            currentSection = section;
            currentIndex = 0;
            answered = false;

            document.getElementById('tab-grammar').classList.toggle('active', section === 'grammar');
            document.getElementById('tab-reading').classList.toggle('active', section === 'reading');

            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            const list = getActiveList();
            const q = list[currentIndex];

            // تحديث شريط التقدم
            const progress = ((currentIndex + 1) / list.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // النصوص
            document.getElementById('question-count').innerText = `السؤال ${currentIndex + 1} من ${list.length}`;
            document.getElementById('original-num').innerText = `الرمز الأصلي: #${q.num}`;
            document.getElementById('question-text').innerHTML = q.q.replace(/\n/g, '<br>');
            document.getElementById('feedback-msg').innerText = '';
            document.getElementById('next-btn').style.display = 'none';

            // بناء الخيارات
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.opts.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span>${opt}</span><span id="badge-${idx}"></span>`;
                btn.onclick = () => selectAnswer(idx);
                container.appendChild(btn);
            });
        }

        function selectAnswer(userPick) {
            if (answered) return;
            answered = true;

            const list = getActiveList();
            const q = list[currentIndex];
            const buttons = document.querySelectorAll('.option-btn');

            buttons.forEach((btn, idx) => {
                btn.disabled = true; // تعطيل الضغط بعد الإجابة
                const badge = document.getElementById(`badge-${idx}`);

                // 1. تلوين الإجابة الصحيحة بالأصفر
                if (idx === q.ans) {
                    btn.classList.add('correct-ans');
                    badge.innerHTML = `<span class="status-badge badge-correct">الإجابة الصحيحة ✓</span>`;
                }

                // 2. إظهار الخطأ القديم بالأحمر المشطوب
                if (idx === q.prevWrong) {
                    btn.classList.add('prev-wrong-ans');
                    if (idx !== q.ans) {
                        badge.innerHTML += `<span class="status-badge badge-prev">خطؤك السابق ✕</span>`;
                    }
                }

                // 3. تمييز اختيار المستخدم الحالي بإطار أزرق
                if (idx === userPick) {
                    btn.classList.add('user-picked');
                    if (idx !== q.ans && idx !== q.prevWrong) {
                        badge.innerHTML += `<span class="status-badge badge-user">اختيارك الحالي</span>`;
                    }
                }
            });

            // إظهار زر التالي
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function nextQuestion() {
            const list = getActiveList();
            if (currentIndex < list.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                showQuizEnd();
            }
        }

        function showQuizEnd() {
            const card = document.getElementById('quiz-card');
            card.innerHTML = `
                <div class="result-box">
                    <h2>🎉 أحسنت! أنهيت هذا القسم بالكامل.</h2>
                    <p style="margin-bottom: 20px; font-size: 1.1rem;">تمت مراجعة جميع الأسئلة والحلول وتثبيت الإجابات الصحيحة.</p>
                    <button class="tab-btn active" style="max-width: 250px; margin: 0 auto;" onclick="changeSection(currentSection === 'grammar' ? 'reading' : 'grammar')">
                        الانتقال للقسم الآخر ←
                    </button>
                </div>
            `;
        }

        // بدء الكويز
        loadQuestion();
    </script>
